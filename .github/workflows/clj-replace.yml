name: clj-replace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: clj-replace-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: bb test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # DeLaGuardo/setup-clojure 13.7.0, pinned by commit
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74
        with:
          bb: 1.12.216
          clj-kondo: 2024.09.27
          cljfmt: 0.13.1
      - name: Cache dependencies fetched by add-deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.deps.clj
          key: deps-${{ hashFiles('skills/clj-replace/scripts/*.bb') }}
          restore-keys: deps-
      - run: bb lint
      - run: bb test

  perf:
    name: performance guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # DeLaGuardo/setup-clojure 13.7.0, pinned by commit
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74
        with:
          bb: 1.12.216
      - name: Cache dependencies fetched by add-deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.deps.clj
          key: deps-${{ hashFiles('skills/clj-replace/scripts/*.bb') }}
          restore-keys: deps-
      - name: Compare with the base branch's script
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          nproc && lscpu | head -n 15
          script=skills/clj-replace/scripts/clj-replace.bb
          baseline="$RUNNER_TEMP/baseline.bb"
          git rev-parse --verify "origin/$BASE_REF" > /dev/null
          if git cat-file -e "origin/$BASE_REF:$script" 2> /dev/null; then
            git show "origin/$BASE_REF:$script" > "$baseline"
            bb bench --baseline "$baseline"
          else
            echo "No $script on $BASE_REF: scaling checks only."
            bb bench
          fi
